services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: schedule_db
      MYSQL_USER: schedule
      MYSQL_PASSWORD: schedule
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    image: migrate/migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "mysql://schedule:schedule@tcp(db:3306)/schedule_db",
        "up"
      ]
    restart: on-failure

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: "schedule:schedule@tcp(db:3306)/schedule_db?parseTime=true"
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  db_data:
